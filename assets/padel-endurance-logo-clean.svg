<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
  <title id="title">Pádel Endurance</title>
  <desc id="desc">Logotipo vectorial de Pádel Endurance con una paleta y la palabra Pádel claramente legible.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#dce2e5"/>
      <stop offset="1" stop-color="#8d979d"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efff43"/>
      <stop offset="1" stop-color="#b7df00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".7"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <g transform="translate(10 18) rotate(-9 110 105)">
      <ellipse cx="112" cy="92" rx="62" ry="73" fill="#090d10" stroke="url(#metal)" stroke-width="11"/>
      <ellipse cx="112" cy="92" rx="47" ry="57" fill="#11181c" stroke="#dfff00" stroke-width="3" opacity=".96"/>
      <g fill="#dfff00" opacity=".95">
        <circle cx="94" cy="65" r="4"/><circle cx="112" cy="65" r="4"/><circle cx="130" cy="65" r="4"/>
        <circle cx="85" cy="82" r="4"/><circle cx="103" cy="82" r="4"/><circle cx="121" cy="82" r="4"/><circle cx="139" cy="82" r="4"/>
        <circle cx="94" cy="99" r="4"/><circle cx="112" cy="99" r="4"/><circle cx="130" cy="99" r="4"/>
        <circle cx="103" cy="116" r="4"/><circle cx="121" cy="116" r="4"/>
      </g>
      <path d="M99 159 L91 208 Q89 221 101 224 Q114 226 118 211 L127 160" fill="url(#metal)" stroke="#080b0d" stroke-width="6"/>
    </g>
    <text x="210" y="70" fill="url(#lime)" stroke="#080b0d" stroke-width="5" paint-order="stroke" font-family="Arial Black, Impact, sans-serif" font-size="54" font-style="italic" font-weight="900" letter-spacing="2">PÁDEL</text>
    <text x="188" y="171" fill="#f7f8f8" stroke="#080b0d" stroke-width="5" paint-order="stroke" font-family="Arial Black, Impact, sans-serif" font-size="95" font-weight="900" letter-spacing="-5">ENDURANCE</text>
    <path d="M205 188 H730" stroke="#dfff00" stroke-width="6" stroke-linecap="round" opacity=".88"/>
  </g>
</svg>
